    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('bg-music');
        audio.volume = 0;

    // Try to play (some browsers will block this)
        audio.play().then(() => {
          let volume = 0;
          const fade = setInterval(() => {
            if (volume < 0.5) {
              volume += 0.01;
              audio.volume = volume;
            } else {
              clearInterval(fade);
            }
          }, 100);
        }).catch((e) => {
          console.warn("Autoplay blocked:", e);
        });
      });
    </script>
